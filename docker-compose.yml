services:
  mysql:
    image: mysql:8.4
    container_name: permis-maroc-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-permis_maroc}
      MYSQL_USER: ${MYSQL_USER:-permis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-secret}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    networks:
      - permis-maroc

  # Optional: run the Laravel API in Docker when you have enough disk for a PHP image build.
  # Uncomment and: docker compose --profile api up -d --build
  api:
    profiles: ["api"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: permis-maroc-api
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-permis_maroc}
      DB_USERNAME: ${MYSQL_USER:-permis}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      SESSION_DRIVER: database
      SESSION_DOMAIN: null
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:3000,127.0.0.1,127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SMS_DRIVER: log
    volumes:
      - ./backend:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - permis-maroc

volumes:
  mysql_data:
  api_vendor:

networks:
  permis-maroc:
    driver: bridge
